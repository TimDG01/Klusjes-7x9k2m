name: Klusjes-herinnering

# ⚠️ DIT IS NIET MEER DE MOTOR ACHTER DE HERINNERINGEN — Google Apps Script is dat.
#
# De cron is hier bewust weggehaald. GitHub maakte de runs wél aan, maar wees er geen runner
# aan toe: de job bleef ~15 minuten in de wachtrij staan en werd dan door GitHub zelf
# geannuleerd, zónder ook maar één stap uit te voeren (runner_id 0, geen logs). Dat leverde
# alleen nog mislukte runs en een mailbox vol foutmeldingen op, terwijl er 's avonds niets
# vertrok. Zie CLAUDE.md → Meldingen voor de opzet die het overnam.
#
# Wat hier blijft staan is de handmatige noodknop: dezelfde scripts/notify.js, te starten via
# Actions → Run workflow. Handig als Apps Script ooit uitvalt, of om te testen zodra GitHub's
# runners het weer doen. Het script bepaalt zelf per gezin of het NU moet sturen (enkel als de
# Brusselse tijd settings/notifyTime bereikt heeft én er die dag nog niets ging), dus een
# extra run kan nooit dubbel sturen.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Nu sturen, ongeacht het uur (test). Respecteert wel "uit" en stuurt enkel naar kinderen met openstaande klusjes + een token.'
        type: boolean
        default: false

# Voorkom dat overlappende runs tegelijk sturen.
concurrency:
  group: klusjes-herinnering
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node opzetten
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Dependencies installeren
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Herinneringen sturen
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force }}
        run: node notify.js
